# Mirrors Ugens register from bizdex.dk every Monday. bizdex publishes a week at
# 00:00 Danish time on the Monday eight days after it ends; 07:00 UTC is well after.
name: Hent ugens tal
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    # Job level, so the Kaggle step's `if:` can see whether the secrets exist.
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Hent data fra bizdex.dk
        run: |
          curl -fsSL https://bizdex.dk/register/data.csv -o data/ugens-register.csv
          # The repo's copy of the descriptor points at the file next to it, not at bizdex.dk.
          curl -fsSL https://bizdex.dk/register/datapackage.json \
            | python3 -c "import json,sys; p=json.load(sys.stdin); p['resources'][0]['path']='data/ugens-register.csv'; print(json.dumps(p, ensure_ascii=False, indent=2))" \
            > datapackage.json
          cp data/ugens-register.csv kaggle/ugens-register.csv
      - name: Gem ændringer
        id: commit
        run: |
          git config user.name "bizdex-data"
          git config user.email "kontakt@bizdex.dk"
          git add data/ugens-register.csv datapackage.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Ugens register til og med uge $(tail -n 1 data/ugens-register.csv | cut -d, -f1)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Ny version på Kaggle
        if: steps.commit.outputs.changed == 'true' && env.KAGGLE_KEY != ''
        run: |
          pip install --quiet kaggle
          kaggle datasets version -p kaggle -m "Til og med uge $(tail -n 1 data/ugens-register.csv | cut -d, -f1)"
